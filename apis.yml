name: Roborock
description: >-
  Roborock is a global consumer robotics company best known for its robot
  vacuum and mop cleaners, wet/dry wash-and-fill floor washers, and connected
  home-cleaning appliances controlled through the Roborock mobile app. Founded
  in 2014 and headquartered in Beijing, the company was surfaced in the API
  Evangelist network as a portfolio company of Qiming Venture Partners. Roborock
  operates a private cloud that backs its consumer mobile app but publishes no
  public developer API, developer portal, OpenAPI specification, or SDK program.
  It does operate a public Trust Center documenting the security and privacy
  design of its IoT products, including TÜV Rheinland EN 303 645 and UL Diamond
  IoT Security certifications.
